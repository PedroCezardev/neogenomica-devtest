name: NeoGenomica CI Pipeline (Tests & Quality)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: ⚙️ Backend — Unit Tests & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: 📦 Instalar Dependências
        run: npm ci || npm install

      - name: 🧪 Executar Testes Unitários (Vitest)
        env:
          JWT_SECRET: 'secret-teste-ci-pipeline-123'
        run: npm test

  frontend-ci:
    name: 🖥️ Frontend — Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/devtest-frontend

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/devtest-frontend/package-lock.json'

      - name: 📦 Instalar Dependências
        run: npm ci || npm install

      - name: 🔍 Checagem Estática de Código (ESLint)
        run: npm run lint

      - name: 🧪 Executar Testes Unitários (Vitest + RTL)
        run: npm test

      - name: 🏗️ Validar Build de Produção (Next.js)
        run: npm run build
